name: 编译红米AX6000固件

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/chasey-dev/immortalwrt-mt798x-rebase
  REPO_BRANCH: "25.12"
  CONFIG_FILE: firmware_build/ax6000-stock.config
  DIY_SH: firmware_build/diy.sh
  TZ: Asia/Shanghai

concurrency:
  group: firmware-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool clang llvm libbpf-dev libclang-dev lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: 清理磁盘空间
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: false
          dotnet: false
          haskell: false
          large-packages: false
          swap-storage: false

      - name: 下载固件源码
        working-directory: /workdir
        run: |
          df -hT $PWD
          git clone $REPO_URL -b $REPO_BRANCH openwrt --single-branch --filter=blob:none
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: 应用自定义修改
        run: |
          chmod +x $DIY_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_SH

      - name: 更新并安装 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 检出 honk 源码到 daeuniverse 源
        uses: actions/checkout@v4
        with:
          repository: daeuniverse/honk
          ref: v0.1.0-beta.6
          fetch-depth: 0
          path: honk-src

      - name: 装入 honk 源码、预置配置与路由器侧 daeuniverse 软件源
        run: |
          mkdir -p openwrt/feeds/daeuniverse/honk/src
          cp -a honk-src/. openwrt/feeds/daeuniverse/honk/src/
          cp $GITHUB_WORKSPACE/firmware_build/honk/config.dae openwrt/feeds/daeuniverse/honk/files/config.dae
          mkdir -p openwrt/package/base-files/files/etc/apk/keys openwrt/package/base-files/files/etc/apk/repositories.d
          cp openwrt/feeds/daeuniverse/keys/public-key.pem openwrt/package/base-files/files/etc/apk/keys/daeuniverse.pem
          cat > openwrt/package/base-files/files/etc/apk/repositories.d/daeuniverse.list << 'EOF'
          @daeuniverse https://openwrt.daeuniverse.org/25.12/packages/aarch64_cortex-a53/packages.adb
          EOF

      - name: 读取 honk 钉版 Rust 工具链版本
        id: honk_toolchain
        working-directory: honk-src
        run: |
          echo "stable=$(grep -oP '^channel\s*=\s*\"\K[^\"]+' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
          echo "ebpf=$(grep -oP '^channel\s*=\s*\"\K[^\"]+' crates/honk-ebpf/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: 安装 Rust 稳定工具链（honk 主程序）
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.honk_toolchain.outputs.stable }}
          target: aarch64-unknown-linux-musl

      - name: 安装 Rust nightly 工具链（honk eBPF 对象）
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.honk_toolchain.outputs.ebpf }}
          components: rust-src, llvm-tools

      - name: 安装钉版 bpf-linker
        working-directory: honk-src
        run: |
          source .github/ci/pins.env
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/bpf-linker.tar.zst" \
            "https://github.com/aya-rs/bpf-linker/releases/download/v$BPF_LINKER_VERSION/bpf-linker-x86_64-unknown-linux-musl.tar.zst"
          echo "$BPF_LINKER_SHA256  $RUNNER_TEMP/bpf-linker.tar.zst" | sha256sum -c -
          zstd -dc "$RUNNER_TEMP/bpf-linker.tar.zst" | tar -xf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
          bpf-linker --version

      - name: 修复 rust host 构建（保留 vendor/*.orig）
        run: |
          cd openwrt
          python3 $GITHUB_WORKSPACE/firmware_build/fix-rust-orig.py

      - name: 载入编译配置
        run: |
          [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
          cd openwrt
          make defconfig

      - name: 校验解析结果（机型与关键包）
        run: |
          cd openwrt
          grep -q '^CONFIG_TARGET_PROFILE="DEVICE_xiaomi_redmi-router-ax6000-stock"$' .config || { echo 'ERROR: 机型解析错误，停工'; exit 1; }
          for p in honk luci-app-honk luci-app-nikki luci-app-smartdns luci-app-mtwifi-cfg luci-app-store luci-theme-mono luci-app-lucky luci-theme-vantage; do
            grep -q "^CONFIG_PACKAGE_${p}=y$" .config || { echo "ERROR: 关键包缺失 $p，停工"; exit 1; }
          done

      - name: 下载软件包
        run: |
          cd openwrt
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译固件
        id: compile
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 整理固件文件
        id: organize
        if: steps.compile.outputs.status == 'success'
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 上传固件到 Artifacts
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success'
        with:
          name: redmi-ax6000-512m-firmware
          path: ${{ env.FIRMWARE }}

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        if: steps.organize.outputs.status == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: firmware-${{ github.run_number }}
          name: 红米AX6000固件 #${{ github.run_number }}
          body: 红米AX6000 512MB闪存版固件（stock 布局，闭源 WiFi 驱动，ImmortalWrt 25.12 / 内核 6.12）
          files: ${{ env.FIRMWARE }}/*

      - name: 清理旧的 workflow 记录
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 0
          keep_minimum_runs: 3